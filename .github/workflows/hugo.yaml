name: Build and deploy with Frontmatter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected publication-branch revision
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  site:
    permissions:
      contents: read
      pages: write
      id-token: write
    # Reviewed Frontmatter Actions implementation (frontmatter-actions PR #1).
    uses: Deadpan-LLC/frontmatter-actions/.github/workflows/hugo-pages.yml@32628f567ce2d43d8f3809e3345211415cb868f0
    with:
      publication-branch: main
      deploy: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
