name: Build and deploy with Frontmatter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected publication-branch revision
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  site:
    permissions:
      contents: read
      pages: write
      id-token: write
    # Initial pilot; repin to the reviewed main commit before merging this migration.
    uses: Deadpan-LLC/frontmatter-actions/.github/workflows/hugo-pages.yml@edbf83f5e951bb2af405078427f74147b0f74643
    with:
      publication-branch: main
      deploy: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
